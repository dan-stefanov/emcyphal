name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "defmt"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --exclude emcyphal-stm32-embassy --exclude emcyphal-stm32-native ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - run: cargo build -p emcyphal-stm32-embassy -p emcyphal-stm32-native --features force-chip${{ matrix.features && format(',{0}', matrix.features) || '' }}
      - if: matrix.features == ''
        run: cargo build --manifest-path examples/nucleo-g431rb/Cargo.toml --target thumbv7em-none-eabihf --release

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude emcyphal-stm32-embassy --exclude emcyphal-stm32-native

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "defmt"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude emcyphal-stm32-embassy --exclude emcyphal-stm32-native ${{ matrix.features && format('--features {0}', matrix.features) || '' }} -- -D warnings
      - run: cargo clippy -p emcyphal-stm32-embassy -p emcyphal-stm32-native --features force-chip${{ matrix.features && format(',{0}', matrix.features) || '' }} -- -D warnings
      - if: matrix.features == ''
        run: cargo clippy --manifest-path examples/nucleo-g431rb/Cargo.toml --target thumbv7em-none-eabihf -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
